[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vu Nguyen", email = "vu.nguyenkhac@avironactive.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "httpx2>=2.13.1",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]


# ---------------------------------------------------------------------------
# ruff — lint + format gộp một (ESLint + Prettier của Python)
#   uv run ruff check .    -> lint
#   uv run ruff format .   -> format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100          # độ dài dòng tối đa, áp cho cả lint lẫn format
target-version = "py312"   # cho ruff biết syntax 3.12 để gợi ý đúng
indent-width = 2           # thụt lề 2 space thay vì 4 (mặc định PEP 8)

[tool.ruff.lint]
# Chọn bộ rule được bật (mặc định ruff chỉ bật E + F):
#   E  = pycodestyle  — style cơ bản (thụt lề, khoảng trắng...)
#   F  = pyflakes     — lỗi logic: import không dùng, biến chưa định nghĩa
#   I  = isort        — sắp xếp import đúng thứ tự
#   B  = bugbear      — bug pattern kinh điển, gồm mutable default args (B006)
#   UP = pyupgrade    — ép syntax hiện đại: list[str] thay vì List[str]
select = ["E", "F", "I", "B", "UP"]

# ---------------------------------------------------------------------------
# pyright — type checker (tsc --noEmit của Python)
#   uv run pyright
# ---------------------------------------------------------------------------
[tool.pyright]
venvPath = "."                 # tìm virtualenv ở thư mục gốc project
venv = ".venv"                 # tên folder venv do uv tạo (node_modules của Python)
typeCheckingMode = "standard"  # mức vừa; quen rồi có thể nâng lên "strict"
[tool.pytest.ini_options]
pythonpath = ["."]