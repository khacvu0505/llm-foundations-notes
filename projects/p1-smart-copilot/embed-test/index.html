<!doctype html>
<!--
  Claude viết theo yêu cầu, 2026-10-20 — Bài 4 bước 8: trang "của người khác" nhúng widget bằng <iframe>.
  Chạy (từ thư mục p1-smart-copilot/), CHỈ serve thư mục này — serve thư mục cha là lộ backend/.env:
    python3 -m http.server 5500 --bind 127.0.0.1 --directory embed-test
  Mở http://localhost:5500 → origin :5500, widget ở :3100 → khác origin (khác port).
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quán Cà Phê Demo — trang nhúng thử</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: Georgia, serif;
        background: #fdf6e3;
        color: #3b2f2f;
      }
      main {
        max-width: 640px;
      }
      /* iframe = đúng kích thước khung chat khi mở (w-96 × h-[32rem] + bottom-20 trong ChatWidget) */
      #copilot {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 420px;
        height: 640px;
        max-width: 100vw;
        border: 0;
        background: transparent;
        color-scheme: normal;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Quán Cà Phê Demo</h1>
      <p>Trang này chạy ở <code>localhost:5500</code>, không phải Next.js. Widget nằm trong iframe trỏ tới
        <code>localhost:3100/embed</code>.</p>
      <p>Bấm bong bóng 💬 góc phải dưới để hỏi về đơn hàng, doanh thu hoặc thời tiết.</p>
    </main>

    <iframe id="copilot" src="http://localhost:3100/embed" title="Smart Copilot"></iframe>
  </body>
</html>
